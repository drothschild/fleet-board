name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suites:
    strategy:
      fail-fast: false
      matrix:
        # macOS was dropped: its runner took 20+ minutes a run. CI no longer
        # exercises /bin/bash 3.2 or BSD tools; run the touched suites with
        # macOS /bin/bash locally (CLAUDE.md, Shell Portability).
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Show bash version
        run: /bin/bash --version | head -1
      # Uses the runner's system /bin/bash, never a newer one.
      - name: Run offline suites (includes test-clean-room.sh)
        run: /bin/bash .github/scripts/run-suites.sh 'plugins/fleet-board/tests/test-*.sh'
