<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>fleet-board</title>
<link rel="stylesheet" href="/static/board.css">
</head>
<body>
<header id="top">
  <div class="top-left">
    <h1 id="repo" class="repo">fleet-board</h1>
    <span id="run-pill" class="pill" data-state="idle"><span class="pill-dot" aria-hidden="true"></span><span id="run-pill-text">idle</span></span>
    <span id="run-cost" class="run-cost" hidden></span>
  </div>
  <div class="top-right">
    <div class="btn-group" role="group" aria-label="Run">
      <button type="button" id="start-btn" class="btn" disabled>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7-4.5z" fill="currentColor"/></svg>
        <span>Start</span>
      </button>
      <button type="button" id="stop-btn" class="btn" disabled>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1" fill="currentColor"/></svg>
        <span>Stop</span>
      </button>
      <button type="button" id="log-btn" class="btn" aria-expanded="false" aria-controls="log">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
        <span>Log</span>
      </button>
    </div>
    <div class="btn-group" role="group" aria-label="Cards">
      <button type="button" id="import-btn" class="btn">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5h4.5l2.5 2.5v8.5h-7z M9 2.5v2.5h2.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/></svg>
        <span>Import plan</span>
      </button>
      <button type="button" id="new-card-btn" class="btn">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
        <span>New card</span>
      </button>
    </div>
  </div>
</header>
<pre id="log" class="log" hidden></pre>
<main id="board" aria-label="Board"></main>
<section id="import" hidden></section>
<aside id="drawer" hidden></aside>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="/static/board.js"></script>
</body>
</html>
