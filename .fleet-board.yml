# fleet-board config. See the fleet-board README.
board:
  repo: "drothschild/fleet-board"
  states: { in_progress: "In progress", in_review: "In review", human_qa: "Requires Human QA" }
commands:
  test_one: "bash {file}"
  lint: "bash plugins/fleet-board/tests/test-version-bumped.sh"
merge:
  policy: "auto"
limits:
  max_cost_usd: 80
