# fleet-board config. See the fleet-board README.
board:
  repo: "drothschild/fleet-board"
  states: { in_progress: "In progress", in_review: "In review", human_qa: "Requires Human QA" }
commands:
  test_one: "bash {file}"
  # One named test per mutant: the supervisor suites (driver, merging, loop, stuck) and the tick-plan suites
  # (ready, review, merging, followups, scope, stages; the name is the exact check name) honour FLEET_TEST_ONLY;
  # in any other suite the selection shows zero or many tests and the reviewer runs the file
  test_case: "FLEET_TEST_ONLY={name} bash {file}"
  lint: "bash plugins/fleet-board/tests/test-version-bumped.sh"
implementor:
  persona: docs/implementor-persona.md
merge:
  policy: "auto"
supervisor:
  version_bump: merge
  version_bump_paths: ["plugins/**"]
  scope_ignore: [".claude-plugin/marketplace.json", "plugins/*/.claude-plugin/plugin.json"]
  version_files: [".claude-plugin/marketplace.json", "plugins/*/.claude-plugin/plugin.json"]
